<header><div class="in"><h1>🧬 Nucleic Acids Reviewer</h1><input id="q" placeholder="Search terms, definitions, questions…"><div id="pl"></div></div></header>
<main><div class="fw"><b>Learn</b>→<b>Understand</b>→<b>Flashcards</b>→<b>Quiz</b>→<b>Review mistakes</b>→<b>Quick Reference</b>→<b>Retake</b></div><div id="o"></div></main>
<script>
const TP=[
["Nucleic Acids Overview","Slides 1–3","What nucleic acids are.",[
["Nucleic acid","A complex biomolecule that stores genetic information in the form of a code; arise from the nucleus of the cell."],
["The nucleus","Often called the 'control center' of the cell because the nucleic acids within contain the coded instructions for all of the cell's (and therefore the organism's) activities."],
["Two types","Deoxyribonucleic acid (DNA) and ribonucleic acid (RNA)."],
["Nucleic acids as polymers","Polymers consisting of long chains of monomers called nucleotides."]]],
["Nucleotide Structure","Slides 4–6","Parts of a nucleotide and its formation.",[
["Nucleotide (general)","Carbon ring structures containing nitrogen linked to a 5-carbon sugar (a ribose)."],
["Ribonucleotide vs deoxyribonucleotide","The 5-carbon sugar is either ribose or deoxyribose, making the nucleotide either a ribonucleotide or a deoxyribonucleotide."],
["Three parts of a nucleotide","A nitrogenous base, a pentose sugar and a phosphate group."],
["Formation of a nucleotide","Base (adenine) + sugar (deoxyribose) → deoxyadenosine (a nucleoside) + H2O. Then phosphate + the 5′ OH of the nucleoside → deoxyadenosine 5′-monophosphate (a nucleotide) + H2O."]]],

["Two pentose sugars","RNA contains ribose; DNA contains deoxyribose."],

["Nucleoside","A nitrogen base linked by a glycosidic bond to C1′ of a ribose or deoxyribose. A nucleotide WITHOUT a phosphate group is a nucleoside."],
["Naming nucleosides","Change the base ending to -osine for purines and -idine for pyrimidines."],
["Nucleotide (definition)","A nucleoside that forms a phosphate ester with the C5′ OH group of ribose or deoxyribose."],

{h:["Base","Nucleoside","Nucleotide"],r:[["RNA: Adenine (A)","Adenosine","Adenosine 5′-monophosphate (AMP)"],["RNA: Guanine (G)","Guanosine","Guanosine 5′-monophosphate (GMP)"],["RNA: Cytosine (C)","Cytidine","Cytidine 5′-monophosphate (CMP)"],["RNA: Uracil (U)","Uridine","Uridine 5′-monophosphate (UMP)"],["DNA: Adenine (A)","Deoxyadenosine","Deoxyadenosine 5′-monophosphate (dAMP)"],["DNA: Guanine (G)","Deoxyguanosine","Deoxyguanosine 5′-monophosphate (dGMP)"],["DNA: Cytosine (C)","Deoxycytidine","Deoxycytidine 5′-monophosphate (dCMP)"],["DNA: Thymine (T)","Deoxythymidine","Deoxythymidine 5′-monophosphate (dTMP)"]]}],

["Sequence","AMP (adenosine 5′-monophosphate) → ADP (5′-diphosphate) → ATP (5′-triphosphate); each step adds a phosphate and releases H2O."],
["ATP","The major energy source for cellular activity."]]],
["Primary Structure","Slides 14–19","Nucleotide sequence and phosphodiester bonds.",[
["Primary structure","The nucleotide sequence of a nucleic acid."],
["Phosphodiester bond","Joins nucleotides: the 3′-OH of the sugar in one nucleotide forms an ester bond to the phosphate group on the 5′-carbon of the sugar of the next nucleotide (H2O is released)."],
["Ends of a polymer","A free 5′-phosphate group at one end and a free 3′-OH group at the other end."],
["Reading the sequence","Read from the free 5′ end using the letters of the bases. Example: 5′—G—A—T—C—3′."],
["RNA primary structure","A, C, G and U are linked by 3′–5′ ester bonds between ribose and phosphate."],
["DNA primary structure","A, C, G and T are linked by 3′–5′ ester bonds between deoxyribose and phosphate."]]],
["DNA Double Helix","Slides 20–27","Secondary structure.",[
["Double helix","Two strands of nucleotides wind together in a double helix: strands run in opposite directions; bases arranged in step-like pairs; base pairs held together by hydrogen bonding."],
["Complementary base pairs","The pairing is very specific: A–T and G–C."],
["Hydrogen bonds per pair","Two hydrogen bonds between A and T; three between G and C."],
["Purine + pyrimidine","Each pair consists of a purine and a pyrimidine, so pairs are the same width, keeping the strands at equal distances (1.1 nm in the slide figure)."],
["Antiparallel","DNA base-pairing is antiparallel: 5′→3′ (left to right) on top pairs with 5′→3′ (right to left) on the bottom."],
["Backbone and grooves","Sugar-phosphate backbone on the outside with base pairs inside; the helix has a major groove and a minor groove."],
["Base pairing in RNA","RNA is usually single stranded; base pairing can occur in RNA but is usually within the same strand."]]],
["Ribonucleic Acid (RNA)","Slides 28–30","Differences from DNA and types of RNA.",[
["RNA abundance","RNA is much more abundant than DNA."],
["DNA vs RNA differences","Sugar: ribose (RNA), deoxyribose (DNA). Base: uracil replaces thymine in RNA (U pairs with A). RNA is single stranded; DNA is double stranded. RNA molecules are much smaller than DNA molecules."],
["Three main RNA types","Ribosomal (rRNA), messenger (mRNA) and transfer (tRNA)."],
["rRNA","About 75% of total RNA; major component of the ribosomes."],
["mRNA","5–10% of total RNA; carries information for protein synthesis from the DNA in the nucleus to the ribosomes."],
["tRNA","10–15% of total RNA; brings amino acids to the ribosomes for protein synthesis."]],
{h:["Feature","DNA","RNA"],r:[["Sugar","Deoxyribose","Ribose"],["Bases","A, G, C, T","A, G, C, U"],["Strands","Double stranded","Single stranded (usually)"],["Size","Much larger","Much smaller"]]}]];

[0,"The 'control center' of the cell is the:",["Nucleus","Ribosome","Membrane","Vacuole"],0,"E"],

[2,"Which are purines?",["Adenine and guanine","Cytosine and thymine","Thymine and uracil","Cytosine and uracil"],0,"E"],
[2,"Which base is found in DNA only?",["Thymine","Uracil","Cytosine","Adenine"],0,"E"],
[2,"Which base is found in RNA only?",["Uracil","Thymine","Guanine","Cytosine"],0,"E"],
[2,"True or false: cytosine is found in both DNA and RNA.",["True","False"],0,"M"],
[3,"DNA contains which sugar?",["Deoxyribose","Ribose","Glucose","Fructose"],0,"E"],
[3,"Deoxyribose lacks oxygen on carbon:",["2′","1′","5′","4′"],0,"M"],
[3,"Sugar carbons are numbered with primes to distinguish them from:",["The nitrogen bases","The phosphate","Water","Hydrogen"],0,"D"],
[4,"A nucleoside is:",["A base linked to a sugar (no phosphate)","A base with a phosphate","A sugar and phosphate","Two nucleotides"],0,"E"],
[4,"The glycosidic bond in a nucleoside links the base to carbon:",["C1′","C3′","C5′","C2′"],0,"M"],
[4,"Nucleosides of purines end in:",["-osine","-idine","-ase","-ose"],0,"M"],
[4,"Nucleosides of pyrimidines end in:",["-idine","-osine","-ase","-yl"],0,"M"],
[4,"The nucleoside of cytosine in RNA is:",["Cytidine","Cytosine","Deoxycytidine","Uridine"],0,"M"],
[4,"dTMP stands for:",["Deoxythymidine 5′-monophosphate","Thymine triphosphate","Deoxytyrosine monophosphate","Diphosphate"],0,"D"],
[4,"The nucleotide is a phosphate ester at which carbon?",["C5′","C1′","C3′","C2′"],0,"D"],
[5,"The major energy source for cellular activity is:",["ATP","AMP","DNA","tRNA"],0,"E"],
[5,"Adding a phosphate to AMP gives:",["ADP","ATP","GMP","dAMP"],0,"M"],
[6,"The primary structure of a nucleic acid is the:",["Nucleotide sequence","Double helix","Groove","Hydrogen bonding"],0,"E"],
[6,"Nucleotides are joined by:",["Phosphodiester bonds","Peptide bonds","Glycosidic bonds only","Disulfide bonds"],0,"E"],
[6,"The phosphodiester bond joins the 3′-OH of one sugar to the phosphate on the ___ carbon of the next.",["5′","1′","2′","4′"],0,"M"],

[7,"Each DNA base pair is a:",["Purine and a pyrimidine","Two purines","Two pyrimidines","Base and sugar"],0,"M"],
[7,"The two strands of the DNA double helix are:",["Antiparallel","Parallel","Identical","Single"],0,"E"],
[7,"True or false: RNA is usually double stranded.",["True","False"],1,"E"],
[8,"In RNA, uracil replaces:",["Thymine","Cytosine","Adenine","Guanine"],0,"E"],
[8,"Which RNA is the major component of ribosomes?",["rRNA","mRNA","tRNA","DNA"],0,"M"],
[8,"Which RNA carries information from DNA to the ribosomes?",["mRNA","tRNA","rRNA","dATP"],0,"M"],
[8,"Which RNA brings amino acids to ribosomes?",["tRNA","mRNA","rRNA","None"],0,"M"],
[8,"rRNA makes up about what percent of total RNA?",["75","5–10","10–15","100"],0,"D"],
[8,"Name the RNA type that makes up 10–15% of total RNA (abbreviation).",[],["trna","transfer rna"],"D"]];
QZ.forEach(q=>{if(q[2].length){const c=q[2][q[3]];q[2]=[...q[2]].sort(()=>Math.random()-.5);q[3]=q[2].indexOf(c)}else{q[5]=q[3];q[3]=-1}});
const DF={E:"Easy",M:"Medium",D:"Difficult"};
let ST={v:{},qa:{},f:{},sc:[],h:[]};try{Object.assign(ST,JSON.parse(localStorage.getItem("nuc")||"{}"))}catch(e){}

const $=s=>document.querySelector(s),O=$("#o");
const CD=TP.flatMap((t,i)=>t[3].map((c,j)=>({k:i+"-"+j,t:i,q:c[0],a:c[1]})));
const PB=p=>`<div class="p"><i style="width:${p}%"></i></div>`;
const TB=t=>t[4]?`<div class="x"><table><tr>${t[4].h.map(h=>`<th>${h}</th>`).join("")}</tr>${t[4].r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`:"";
const kn=i=>TP[i][3].filter((_,j)=>ST.f[i+"-"+j]=="k").length/TP[i][3].length,tp=i=>Math.round((ST.v[i]?50:0)+kn(i)*50);
const tot=()=>{let c=0,w=0;Object.values(ST.qa).forEach(a=>{c+=a.c;w+=a.w});return[c,w]};
const wk=()=>TP.map((_,i)=>i).filter(i=>{const a=ST.qa[i];return a&&a.w&&a.c/(a.c+a.w)<.7});
const NAV=[["dash","Dashboard"],["full","Full Reviewer"],["topics","Topics"],["expl","Explanations"],["quiz","Quiz"],["cards","Flashcards"],["quick","Quick Reference"],["prog","Progress"]];
let cur="dash",arg,F={g:"all",i:0,f:0},Z=null;
$("#pl").innerHTML=NAV.map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join("");
const body=i=>{const t=TP[i];return`<div class="c"><h2 style="margin:0">${t[0]}</h2><div class="m">Source Section: ${t[1]}</div><p>${t[2]}</p>${t[3].map(c=>`<p><b>${c[0]}.</b> ${c[1]}</p>`).join("")}${TB(t)}</div>`};
const R={
dash(){const[c,w]=tot(),vc=Object.keys(ST.v).length,k=Object.values(ST.f).filter(x=>x=="k").length,p=Math.round((vc/TP.length+k/CD.length)*50);
return`<h1>Dashboard</h1><div class="g">${[["Topics",TP.length],["Concepts",CD.length],["Quiz questions",QZ.length],["Flashcards",CD.length],["Progress",p+"%"],["Answered",c+w],["Correct",c],["Incorrect",w],["Topics reviewed",vc+"/"+TP.length]].map(x=>`<div class="c"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("")}</div>${PB(p)}<p><button class="b" data-go="topics" data-a="${Math.min(vc,TP.length-1)}">Continue Studying</button><button class="b" data-go="quiz">Take a Quiz</button><button class="b" data-go="cards">Review Flashcards</button><button class="b o" data-go="quick">Quick Reference</button></p><div class="c"><b>Weak topics:</b> ${wk().map(i=>`<span class="t">${TP[i][0]}</span>`).join("")||"<span class='m'>none yet</span>"}</div><div class="c"><b>Recently studied:</b> ${ST.h.slice(-5).reverse().map(i=>`<span class="t">${TP[i][0]}</span>`).join("")||"<span class='m'>nothing yet</span>"}</div><p class="m">Source: Nucleic Acids slides (uploaded). Content comes only from that file.</p>`},

return"<h1>Topics</h1>"+TP.map((t,i)=>`<div class="c"><h3 style="margin:0">${t[0]}</h3><p>${t[2]}</p><span class="t">${t[3].length} concepts</span><span class="t">${QZ.filter(q=>q[0]==i).length} questions</span><span class="t">${t[3].length} flashcards</span>${PB(tp(i))}<button class="b" data-go="topics" data-a="${i}">Open</button><button class="b o" data-go="cards" data-a="${i}">Flashcards</button></div>`).join("")},
